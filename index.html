<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Recipes - Heirloom Cookbook</title>
  <meta name="description" content="A treasured collection of cherished family favorites, handwritten recipes, and homemade classics.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="index-container">
    <!-- Hero Header -->
    <header class="site-hero">
      <span class="brand-pill">Heirloom Cookbook</span>
      <h1>Family Recipes</h1>
      <p class="tagline">A treasured collection of cherished family favorites, handwritten recipes, and timeless homemade classics.</p>
    </header>

    <!-- Controls: Search & Category Filters -->
    <section class="controls-panel" aria-label="Search and filter recipes">
      <div class="search-and-sort-bar">
        <div class="search-box-wrapper">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input 
            type="search" 
            id="search-input" 
            class="search-input" 
            placeholder="Search by recipe name or ingredient (e.g., rhubarb, cinnamon, pecans, chicken, beef)..." 
            aria-label="Search recipes"
            autocomplete="off"
          >
          <button type="button" id="search-clear" class="search-clear-btn" aria-label="Clear search" title="Clear search">✕</button>
        </div>

        <div class="sort-wrapper">
          <label for="sort-select" class="sort-label">Sort by:</label>
          <select id="sort-select" class="sort-select" aria-label="Sort recipes">
            <option value="alpha-asc" selected>Alphabetical (A → Z)</option>
            <option value="alpha-desc">Alphabetical (Z → A)</option>
            <option value="category">Category</option>
            <option value="ingredients-asc">Fewest Ingredients</option>
            <option value="ingredients-desc">Most Ingredients</option>
          </select>
        </div>
      </div>

      <nav class="category-filter-bar" id="category-filters" aria-label="Recipe categories">
        <button type="button" class="filter-btn active" data-category="ALL">All Recipes</button>
      </nav>
    </section>

    <!-- Results Status Meta -->
    <div class="results-meta">
      <div class="results-count" id="results-count">Loading recipes...</div>
      <button type="button" id="reset-filters" class="btn-action" style="display: none; padding: 4px 12px; font-size: 0.8rem;">Reset Filters</button>
    </div>

    <!-- Dynamic Recipe Grid -->
    <main class="recipe-grid" id="recipe-grid" aria-live="polite">
      <noscript>
        <div class="empty-state">
          <div class="empty-state-icon">📖</div>
          <h3>JavaScript Required for Dynamic Search</h3>
          <p>Please enable JavaScript to search and filter our family recipes dynamically.</p>
        </div>
      </noscript>
    </main>

    <!-- Site Footer -->
    <footer class="site-footer">
      <p>Burrell Family Recipes &bull; Heirloom Collection &bull; Handcrafted with love</p>
    </footer>
  </div>

  <!-- Load local JS fallback dataset directly -->
  <script src="recipes-data.js"></script>
  <script>
    // State
    let allRecipes = [];
    let currentCategory = 'ALL';
    let searchQuery = '';

    const gridEl = document.getElementById('recipe-grid');
    const searchInput = document.getElementById('search-input');
    const searchClearBtn = document.getElementById('search-clear');
    const categoryFiltersEl = document.getElementById('category-filters');
    const resultsCountEl = document.getElementById('results-count');
    const resetFiltersBtn = document.getElementById('reset-filters');
    const sortSelect = document.getElementById('sort-select');

    // Fetch and initialize recipes safely across disk (file://) and server (http://)
    async function loadRecipes() {
      // 1. Direct local file:// access check
      if (window.location.protocol === 'file:' && window.__RECIPES_FALLBACK__ && window.__RECIPES_FALLBACK__.length) {
        allRecipes = window.__RECIPES_FALLBACK__;
        setupCategoryFilters();
        render();
        return;
      }

      // 2. HTTP server fetch attempt
      try {
        const response = await fetch('recipes.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        allRecipes = await response.json();
      } catch (err) {
        console.warn('Fetch failed, using JS fallback:', err);
        if (window.__RECIPES_FALLBACK__ && window.__RECIPES_FALLBACK__.length) {
          allRecipes = window.__RECIPES_FALLBACK__;
        } else {
          gridEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <h3>Unable to load recipes</h3>
              <p>Please check that <code>recipes-data.js</code> exists in the same folder as this page.</p>
            </div>`;
          resultsCountEl.textContent = 'Error loading recipes';
          return;
        }
      }

      setupCategoryFilters();
      render();
    }

    // Build category buttons with recipe counts
    function setupCategoryFilters() {
      const categoryCounts = {};
      allRecipes.forEach(r => {
        categoryCounts[r.category] = (categoryCounts[r.category] || 0) + 1;
      });

      const sortedCategories = Object.keys(categoryCounts).sort();

      categoryFiltersEl.innerHTML = `
        <button type="button" class="filter-btn ${currentCategory === 'ALL' ? 'active' : ''}" data-category="ALL">
          All (${allRecipes.length})
        </button>
      ` + sortedCategories.map(cat => `
        <button type="button" class="filter-btn ${currentCategory === cat ? 'active' : ''}" data-category="${escapeHtml(cat)}">
          ${escapeHtml(cat)} (${categoryCounts[cat]})
        </button>
      `).join('');

      categoryFiltersEl.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.getAttribute('data-category');
          categoryFiltersEl.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render();
        });
      });
    }

    // Filter & sort recipes
    function getFilteredRecipes() {
      const q = searchQuery.trim().toLowerCase();

      let filtered = allRecipes.filter(recipe => {
        if (currentCategory !== 'ALL' && recipe.category !== currentCategory) {
          return false;
        }

        if (q) {
          const matchTitle = recipe.title && recipe.title.toLowerCase().includes(q);
          const matchCat = recipe.category && recipe.category.toLowerCase().includes(q);
          const matchSource = recipe.source && recipe.source.toLowerCase().includes(q);
          const matchIng = recipe.ingredients && recipe.ingredients.some(ing => ing.toLowerCase().includes(q));
          const matchInst = recipe.instructions && recipe.instructions.toLowerCase().includes(q);

          if (!matchTitle && !matchCat && !matchSource && !matchIng && !matchInst) {
            return false;
          }
        }

        return true;
      });

      const sortVal = sortSelect ? sortSelect.value : 'alpha-asc';
      filtered.sort((a, b) => {
        if (sortVal === 'alpha-asc') {
          return a.title.localeCompare(b.title);
        } else if (sortVal === 'alpha-desc') {
          return b.title.localeCompare(a.title);
        } else if (sortVal === 'category') {
          return a.category.localeCompare(b.category) || a.title.localeCompare(b.title);
        } else if (sortVal === 'ingredients-asc') {
          return (a.ingredients?.length || 0) - (b.ingredients?.length || 0);
        } else if (sortVal === 'ingredients-desc') {
          return (b.ingredients?.length || 0) - (a.ingredients?.length || 0);
        }
        return 0;
      });

      return filtered;
    }

    // Render cards
    function render() {
      const filtered = getFilteredRecipes();
      const hasActiveFilters = currentCategory !== 'ALL' || searchQuery.trim().length > 0;

      searchClearBtn.style.display = searchQuery ? 'block' : 'none';
      resetFiltersBtn.style.display = hasActiveFilters ? 'inline-flex' : 'none';

      if (filtered.length === allRecipes.length) {
        resultsCountEl.textContent = `Showing all ${allRecipes.length} recipes`;
      } else if (filtered.length === 0) {
        resultsCountEl.textContent = 'No recipes found';
      } else {
        const catInfo = currentCategory !== 'ALL' ? ` in ${currentCategory}` : '';
        const searchInfo = searchQuery ? ` matching "${searchQuery}"` : '';
        resultsCountEl.textContent = `Showing ${filtered.length} of ${allRecipes.length} recipes${catInfo}${searchInfo}`;
      }

      if (filtered.length === 0) {
        gridEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🍳</div>
            <h3>No recipes found</h3>
            <p>We couldn't find any recipes matching your current search or category filter.</p>
            <button type="button" class="btn-reset" onclick="resetFilters()">Reset All Filters</button>
          </div>
        `;
        return;
      }

      gridEl.innerHTML = filtered.map(recipe => {
        const count = recipe.ingredients ? recipe.ingredients.length : 0;
        const countLabel = count === 1 ? '1 ingredient' : `${count} ingredients`;
        const snippetText = recipe.snippet || (recipe.ingredients ? recipe.ingredients.slice(0, 3).join(', ') : '');

        return `
          <a href="${encodeURI(recipe.filename)}" class="recipe-card-item">
            <div class="card-top">
              <span class="card-category">${escapeHtml(recipe.category)}</span>
              <h2 class="card-title">${escapeHtml(recipe.title)}</h2>
              <div class="card-snippet">${escapeHtml(snippetText)}</div>
            </div>
            <div class="card-bottom">
              <span class="card-ingredients-count">${countLabel}</span>
              <span class="card-cta">View Recipe &rarr;</span>
            </div>
          </a>
        `;
      }).join('');
    }

    window.resetFilters = function() {
      searchQuery = '';
      currentCategory = 'ALL';
      searchInput.value = '';
      if (sortSelect) sortSelect.value = 'alpha-asc';
      
      categoryFiltersEl.querySelectorAll('.filter-btn').forEach(b => {
        if (b.getAttribute('data-category') === 'ALL') {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
      
      render();
      searchInput.focus();
    };

    resetFiltersBtn.addEventListener('click', window.resetFilters);

    let debounceTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchQuery = e.target.value;
        render();
      }, 100);
    });

    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      render();
      searchInput.focus();
    });

    if (sortSelect) {
      sortSelect.addEventListener('change', render);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadRecipes();
  </script>
</body>
</html>
